<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="login-page" class="page">
            <h1>Admin Login</h1>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="login-error" class="error"></p>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-dashboard" class="page hidden">
            <h1>Admin Dashboard</h1>
            <button id="logout-btn" class="logout-btn">Logout</button>
            
            <div class="user-list-section">
                <h2>Users</h2>
                <button id="create-user-btn">Create New User</button>
                <div id="users-list"></div>
            </div>
        </div>

        <!-- Create User Modal -->
        <div id="create-user-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Create New User</h2>
                <input type="text" id="new-username" placeholder="Enter username">
                <button id="confirm-create-user">Create</button>
                <button id="cancel-create-user">Cancel</button>
            </div>
        </div>

        <!-- User Feed -->
        <div id="user-feed" class="page hidden">
            <h1>User Feed - <span id="current-username"></span></h1>
            <a href="#" id="profile-link" class="profile-link">Go to Profile</a>
            <p id="feed-status"></p>
            <div id="cards-container" class="cards-container"></div>
            <button id="back-to-admin" class="back-btn hidden">Back to Admin</button>
        </div>

        <!-- User Profile -->
        <div id="user-profile" class="page hidden">
            <h1>Personal Cabinet - <span id="profile-username"></span></h1>
            <button id="back-to-feed" class="back-btn">Back to Feed</button>
            <div id="explanation-container">
                <h2>Recommendation Explanation</h2>
                <div id="explanation-content"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
